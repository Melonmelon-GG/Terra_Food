spring:
  application:
    name: dayan-food
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/dayan_food?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
app:
  upload-directory: ${UPLOAD_DIRECTORY:uploads}
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
