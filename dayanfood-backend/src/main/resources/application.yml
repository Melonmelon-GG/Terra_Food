spring:
  application:
    name: dayan-food
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/dayan_food?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false
      use-key-prefix: true
  session:
    store-type: redis
    timeout: ${SESSION_TIMEOUT:7d}
    redis:
      namespace: dayan-food:session
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLED:true}
          ssl:
            enable: ${MAIL_SSL_ENABLED:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
app:
  upload-directory: ${UPLOAD_DIRECTORY:uploads}
  upload:
    max-image-bytes: ${MAX_IMAGE_BYTES:5242880}
    orphan-retention: ${UPLOAD_ORPHAN_RETENTION:24h}
    cleanup-cron: ${UPLOAD_CLEANUP_CRON:0 30 3 * * *}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  initial-admin:
    enabled: ${INITIAL_ADMIN_ENABLED:false}
    username: ${INITIAL_ADMIN_USERNAME:admin}
    password: ${INITIAL_ADMIN_PASSWORD:}
    display-name: ${INITIAL_ADMIN_DISPLAY_NAME:珍馐志管理员}
  agent:
    service-url: ${AGENT_SERVICE_URL:http://localhost:8090}
    internal-token: ${AGENT_INTERNAL_TOKEN:}
  registration-code:
    from: ${MAIL_FROM:}
    expiration: ${REGISTRATION_CODE_EXPIRATION:10m}
    resend-interval: ${REGISTRATION_CODE_RESEND_INTERVAL:60s}
    max-attempts: ${REGISTRATION_CODE_MAX_ATTEMPTS:5}
server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
        # 默认保存登录 7 天，与 Redis 会话的默认空闲超时保持一致。
        max-age: ${SESSION_COOKIE_MAX_AGE:7d}
  error:
    include-message: never
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

---
# 生产环境默认启用 Secure Cookie；仅 HTTP 临时部署可通过环境变量显式关闭。
# HTTPS 保持默认 true；HTTP 部署必须显式设置 SESSION_COOKIE_SECURE=false。
spring:
  config:
    activate:
      on-profile: prod

server:
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:true}
