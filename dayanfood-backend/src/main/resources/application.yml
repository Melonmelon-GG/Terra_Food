spring:
  application:
    name: dayan-food
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/dayan_food?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false
      use-key-prefix: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
app:
  upload-directory: ${UPLOAD_DIRECTORY:uploads}
  initial-users:
    admin-password: ${INITIAL_ADMIN_PASSWORD:admin123}
    user-password: ${INITIAL_USER_PASSWORD:user123}
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
