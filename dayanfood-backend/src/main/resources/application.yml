spring:
  application:
    name: dayan-food
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/dayan_food?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false
      use-key-prefix: true
  session:
    store-type: redis
    timeout: ${SESSION_TIMEOUT:30m}
    redis:
      namespace: dayan-food:session
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
app:
  upload-directory: ${UPLOAD_DIRECTORY:uploads}
  upload:
    max-image-bytes: ${MAX_IMAGE_BYTES:5242880}
    orphan-retention: ${UPLOAD_ORPHAN_RETENTION:24h}
    cleanup-cron: ${UPLOAD_CLEANUP_CRON:0 30 3 * * *}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  initial-users:
    enabled: ${INITIAL_USERS_ENABLED:false}
    admin-password: ${INITIAL_ADMIN_PASSWORD:}
    user-password: ${INITIAL_USER_PASSWORD:}
server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
  error:
    include-message: never
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
