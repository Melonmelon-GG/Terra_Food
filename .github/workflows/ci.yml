name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: dayanfood-backend/pom.xml

      - name: Compile and test backend
        working-directory: dayanfood-backend
        run: mvn --batch-mode --no-transfer-progress verify

  frontend:
    name: Frontend (Vue)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Type-check and build
        working-directory: web
        run: npm run build

  agent:
    name: Agent (Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent-service/requirements.lock

      - name: Install dependencies
        run: python -m pip install --require-hashes --requirement agent-service/requirements.lock

      - name: Check Python syntax
        run: python -m compileall -q agent-service/app

      - name: Verify service imports
        working-directory: agent-service
        run: python -c "import app.main; import app.mcp_server"

      - name: Agent budget and cancellation contracts
        working-directory: agent-service
        run: python -m unittest discover -s tests -v

  compose:
    name: Docker Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    env:
      MYSQL_ROOT_PASSWORD: ci-dummy-mysql-password
      MYSQL_APP_USER: ci_app
      MYSQL_APP_PASSWORD: ci-dummy-app-password
      REDIS_PASSWORD: ci-dummy-redis-password
      AGENT_INTERNAL_TOKEN: ci-dummy-agent-token-at-least-32-characters
      MCP_INTERNAL_TOKEN: ci-dummy-mcp-token-at-least-32-characters
      MCP_BACKEND_TOKEN: ci-dummy-mcp-backend-token-at-least-32-characters
      MINIO_ROOT_USER: ci-dummy-minio-user
      MINIO_ROOT_PASSWORD: ci-dummy-minio-password
      OPENAI_API_KEY: ci-dummy-model-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate Docker Compose
        run: docker compose --profile agent config --quiet
