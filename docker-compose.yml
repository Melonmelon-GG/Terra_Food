# Terra Food 本地依赖：MySQL + Redis；Agent profile 启动 MCP 与 LangChain。
# 长期记忆已隔离；旧 Milvus 仅使用 memory-maintenance profile 做受控维护。
# 基础服务：docker compose up -d
# Agent 全栈：docker compose --profile agent up -d
services:
  mysql:
    image: mysql:8.4
    container_name: dayan-food-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: dayan_food
      MYSQL_USER: ${MYSQL_APP_USER:?set MYSQL_APP_USER}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?set MYSQL_APP_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dayan-food-redis
    restart: unless-stopped
    # 开启 AOF：会话与缓存存于 Redis，避免重启/掉电批量丢会话导致全员掉线。
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  milvus-etcd:
    profiles: ["memory-maintenance"]
    image: quay.io/coreos/etcd:v3.5.18
    container_name: dayan-food-milvus-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >-
      etcd --advertise-client-urls=http://127.0.0.1:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - milvus-etcd-data:/etcd

  milvus-minio:
    profiles: ["memory-maintenance"]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: dayan-food-milvus-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    command: minio server /minio_data
    volumes:
      - milvus-minio-data:/minio_data

  milvus:
    profiles: ["memory-maintenance"]
    image: milvusdb/milvus:v3.0.0
    container_name: dayan-food-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      - milvus-etcd
      - milvus-minio

  agent-mcp:
    profiles: ["agent"]
    build: ./agent-service
    container_name: dayan-food-agent-mcp
    command: ["python", "-m", "app.mcp_server"]
    environment:
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:?set AGENT_INTERNAL_TOKEN}
      MCP_BACKEND_TOKEN: ${MCP_BACKEND_TOKEN:?set MCP_BACKEND_TOKEN}
      MCP_INTERNAL_TOKEN: ${MCP_INTERNAL_TOKEN:?set MCP_INTERNAL_TOKEN}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 384m

  agent-api:
    profiles: ["agent"]
    build: ./agent-service
    container_name: dayan-food-agent-api
    environment:
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:?set AGENT_INTERNAL_TOKEN}
      MCP_BACKEND_TOKEN: ${MCP_BACKEND_TOKEN:?set MCP_BACKEND_TOKEN}
      MCP_INTERNAL_TOKEN: ${MCP_INTERNAL_TOKEN:?set MCP_INTERNAL_TOKEN}
      MCP_SERVER_URL: http://agent-mcp:8091/mcp
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      AGENT_MODEL: ${AGENT_MODEL:-deepseek-v4-flash}
      AGENT_PERSONA: ${AGENT_PERSONA:-}
    volumes:
      - agent-model-cache:/home/terra/.cache
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
        - agent-mcp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 384m

volumes:
  mysql-data:
  redis-data:
  milvus-etcd-data:
  milvus-minio-data:
  milvus-data:
  agent-model-cache:
