# Terra Food 本地依赖：MySQL + Redis
# 用法：docker compose up -d
# 密码可通过同目录 .env 覆盖，例如：
#   MYSQL_ROOT_PASSWORD=your-password
services:
  mysql:
    image: mysql:8.4
    container_name: dayan-food-mysql
    restart: unless-stopped
    environment:
      # 后端默认以 root 连接，此密码必须与启动后端时的 DB_PASSWORD 一致
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-replace-me}
      # 自动创建数据库，与 application.yml 的库名一致
      MYSQL_DATABASE: dayan_food
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-replace-me}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dayan-food-redis
    restart: unless-stopped
    # 本地开发默认不设密码，与 application.yml 的 REDIS_PASSWORD 默认值一致
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
  redis-data: