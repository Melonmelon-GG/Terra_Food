log_format terra_timing '$request_id $request_method $uri status=$status '
                        'total=$request_time upstream=$upstream_response_time';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 6m;
    access_log /var/log/nginx/access.log terra_timing;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        add_header X-Upstream-Time $upstream_response_time always;
    }

    location ^~ /uploads/ {
        proxy_pass http://backend:8080;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location ~* ^/assets/.+\.(?:js|css|woff2|png|jpg|jpeg|webp|svg)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
