services:
  mysql:
    image: mysql:8.4
    mem_limit: 768m
    environment:
      MYSQL_DATABASE: reset_test
      MYSQL_USER: reset_app
      MYSQL_PASSWORD: ${RESET_DB_PASSWORD:?isolated password required}
      MYSQL_ROOT_PASSWORD: ${RESET_DB_PASSWORD}
    command: ["--innodb-buffer-pool-size=134217728", "--max-connections=30"]
    volumes: ["db:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h127.0.0.1 -ureset_app -e 'SELECT 1' reset_test"]
      interval: 3s
      timeout: 3s
      retries: 40
  redis:
    image: redis:7-alpine
    mem_limit: 96m
    command: ["redis-server", "--save", "", "--appendonly", "no"]
  mail:
    image: axllent/mailpit:v1.27.4
    mem_limit: 64m
    ports: ["127.0.0.1:18425:8025"]
  backend:
    image: eclipse-temurin:21-jre
    mem_limit: 640m
    command: ["java", "-jar", "/app/app.jar"]
    environment:
      JAVA_TOOL_OPTIONS: -Xms96m -Xmx384m
      DB_URL: jdbc:mysql://mysql:3306/reset_test?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai
      DB_USERNAME: reset_app
      DB_PASSWORD: ${RESET_DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ""
      INITIAL_ADMIN_ENABLED: "false"
      MAIL_HOST: mail
      MAIL_PORT: 1025
      MAIL_SMTP_AUTH: "false"
      MAIL_STARTTLS_ENABLED: "false"
      MAIL_STARTTLS_REQUIRED: "false"
      MAIL_FROM: test@example.test
      REGISTRATION_CODE_EXPIRATION: 30s
      REGISTRATION_CODE_RESEND_INTERVAL: 1s
      UPLOAD_DIRECTORY: /data/uploads
    volumes:
      - ../../../dayanfood-backend/target/dayanfood-backend-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
      - uploads:/data/uploads
    ports: ["127.0.0.1:18480:8080"]
    depends_on:
      mysql: {condition: service_healthy}
  web:
    image: nginx:1.30.5-alpine
    mem_limit: 48m
    volumes:
      - ../../dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["127.0.0.1:18481:80"]
    depends_on: [backend]
volumes:
  db:
  uploads:
